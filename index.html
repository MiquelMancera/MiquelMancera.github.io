<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web portfolio diseño Paula Benitez</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- TEXTURA DE LANA DE FONDO -->
    <div class="wool-texture"></div>

    <!-- FOCO DE LUZ Y CURSOR DINÁMICO -->
    <div class="spotlight"></div>
    <div class="cursor"></div>
	
<!-- FORMAS ORGÁNICAS (Ahora son globales) -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
	
    <nav>
        <div class="logo">PB.</div>
        <ul class="menu">
            <li><a href="#proyectos">Colecciones</a></li>
            <li><a href="#sobre-mi">El Taller</a></li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>

    <header class="hero" id="hero">
        <div class="hero-content fade-scroll">
            <h1>Hilos que cobran vida.</h1>
            <p>Diseño de moda, tricot y exploración de texturas.</p>
        </div>
    </header>

    <section id="proyectos" class="gallery">
        <div class="gallery-header fade-scroll">
            <h2>Colecciones Destacadas</h2>
            <p>El arte de tejer historias a través de las prendas.</p>
        </div>
        
        <div class="grid">
            <!-- COLECCIÓN 1 -->
            <div class="card fade-scroll">
                <div class="carousel">
                    <!-- Las imágenes ya no usan 'carousel-track' con flexbox, sino posición absoluta para el Fade -->
                    <img src="https://images.unsplash.com/photo-1620799140188-3b2a02fd9a77?q=80&w=600&auto=format&fit=crop" alt="Moda tricot 1" class="project-img active">
                    <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=600&auto=format&fit=crop" alt="Moda tricot 2" class="project-img">
                    <img src="https://images.unsplash.com/photo-1551163943-3f6a855d1153?q=80&w=600&auto=format&fit=crop" alt="Moda tricot 3" class="project-img">
                </div>
                <h3>Invierno Orgánico</h3>
            </div>

            <!-- COLECCIÓN 2 -->
            <div class="card fade-scroll">
                <div class="carousel">
                     <img src="https://images.unsplash.com/photo-1620799140188-3b2a02fd9a77?q=80&w=600&auto=format&fit=crop" alt="Moda tricot 1" class="project-img active">
                    <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=600&auto=format&fit=crop" alt="Moda tricot 2" class="project-img">
                    <img src="https://images.unsplash.com/photo-1551163943-3f6a855d1153?q=80&w=600&auto=format&fit=crop" alt="Moda tricot 3" class="project-img">
                </div>
                <h3>Texturas Crudas</h3>
            </div>

            <!-- COLECCIÓN 3 -->
            <div class="card fade-scroll">
                <div class="carousel">
                    <img src="https://images.unsplash.com/photo-1620799140188-3b2a02fd9a77?q=80&w=600&auto=format&fit=crop" alt="Moda tricot 1" class="project-img active">
                    <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=600&auto=format&fit=crop" alt="Moda tricot 2" class="project-img">
                    <img src="https://images.unsplash.com/photo-1551163943-3f6a855d1153?q=80&w=600&auto=format&fit=crop" alt="Moda tricot 3" class="project-img">
                </div>
                <h3>Punto y Forma</h3>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
